name: build-and-deploy

on:
  push:
    tags:
      - 'v*'
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag для деплоя (по умолчанию github.ref_name)'
        required: false

jobs:
  export-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Install Git LFS
        run: git lfs install

      - name: Checkout release tag
        if: github.event_name == 'release'
        run: git checkout ${{ github.event.release.tag_name }}

      - name: Checkout dispatch ref
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.tag != ''
        run: git checkout ${{ github.event.inputs.tag }}

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v1
        with:
          version: '4.5.0'
          include-templates: true
          use-dotnet: false

      - name: Export HTML5 build
        run: godot --headless --path . --export-release "Web" build/web/index.html

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web

  deploy:
    needs: export-web
    runs-on: ubuntu-latest
    steps:
      - name: Download exported build
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: build/web

      - name: Deploy to sych-game
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.SYCH_GAME_TOKEN }}
          external_repository: occultnerdbird/sych-game
          publish_branch: main
          publish_dir: build/web
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com

